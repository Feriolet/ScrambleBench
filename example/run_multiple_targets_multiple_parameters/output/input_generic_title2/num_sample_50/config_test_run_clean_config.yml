input:
  complex_path: /mnt/sod/Veincent/manuscript/ScrambleBench/example/run_multiple_targets_multiple_parameters/input/GPCR_DRD2/gpcr_drd2_6luq_complex_autoprepared.pdb
  pdb_path: /mnt/sod/Veincent/manuscript/ScrambleBench/example/run_multiple_targets_multiple_parameters/input/GPCR_DRD2/gpcr_drd2_6luq_protein_autoprepared.pdb
  sdf_path: /mnt/sod/Veincent/manuscript/ScrambleBench/example/run_multiple_targets_multiple_parameters/input/GPCR_DRD2/gpcr_drd2_6luq_ligand.sdf
  pocket_path: /mnt/sod/Veincent/manuscript/ScrambleBench/example/run_multiple_targets_multiple_parameters/input/GPCR_DRD2/gpcr_drd2_6luq_complex_autopreparedcut10/gpcr_drd2_6luq_complex_autopreparedcut10_pocket_withH.pdb
  pocket_coord: 9.23,6.77,-9.29
  name: generic_title2

model:
  diffsbdd:
    name: DiffSBDD
    dir: /opt/veincent/GenAI_manuscript/ScrambleBench/models/DiffSBDD
    conda_env: benchmark_diffsbdd
  pocket2mol:
    name: Pocket2Mol
    dir: /opt/veincent/GenAI_manuscript/ScrambleBench/models/Pocket2Mol
    conda_env: benchmark_pocket2mol

generation:
  input: /mnt/sod/Veincent/manuscript/ScrambleBench/example/run_multiple_targets_multiple_parameters/output
  output: /mnt/sod/Veincent/manuscript/ScrambleBench/example/run_multiple_targets_multiple_parameters/output/input_generic_title2/num_sample_50/output
  script_pathfile: /mnt/sod/Veincent/manuscript/ScrambleBench/src/scramblebench/script/utils/generation_template.sh
  parameter:
    box_size: 16
    num_sample: 50
    name: 5ht2c_prepared_0
    repeat_parameter:
      num_sample: generation,parameter,num_sample

parameter:
  protein_name: generic_title2
  model_list:
  - DiffSBDD
  - Pocket2Mol
  repeat_parameter:
    num_sample: 50

post_generation:
  input: /mnt/sod/Veincent/manuscript/ScrambleBench/example/run_multiple_targets_multiple_parameters/output/input_generic_title2/num_sample_50/AI_Generation
  output: /mnt/sod/Veincent/manuscript/ScrambleBench/example/run_multiple_targets_multiple_parameters/output/input_generic_title2/num_sample_50/cheminformatics_input_prepared
  pick_last: Pocket2Mol

analysis:
  genbench3d:
    input: /mnt/sod/Veincent/manuscript/ScrambleBench/example/run_multiple_targets_multiple_parameters/output/input_generic_title2/num_sample_50/cheminformatics_input_prepared
    output: /mnt/sod/Veincent/manuscript/ScrambleBench/example/run_multiple_targets_multiple_parameters/output/input_generic_title2/num_sample_50/cheminformatics_analysis
    conda_env: benchmark_genbench3d
    genbench_dir: /mnt/sod/Veincent/manuscript/ScrambleBench/models/genbench3d
    schrodinger_dir: /opt/schrodinger2025-4
    genbench_config: /mnt/sod/Veincent/manuscript/ScrambleBench/models/genbench3d/GenAI_evaluation.yaml
    do_complex_forcefield_minimisation: true
    do_docking_forcefield_minimisation: true
    skip_genbench3d_protonation: true
  redocking:
    protonation:
      input: /mnt/sod/Veincent/manuscript/ScrambleBench/example/run_multiple_targets_multiple_parameters/output/input_generic_title2/num_sample_50/cheminformatics_input_prepared
      output: /mnt/sod/Veincent/manuscript/ScrambleBench/example/run_multiple_targets_multiple_parameters/output/input_generic_title2/num_sample_50/docking
      env: benchmark_easydock
      method: molgpka
    docking:
      easydock:
        input: /mnt/sod/Veincent/manuscript/ScrambleBench/example/run_multiple_targets_multiple_parameters/output/input_generic_title2/num_sample_50/docking
        output: /mnt/sod/Veincent/manuscript/ScrambleBench/example/run_multiple_targets_multiple_parameters/output/input_generic_title2/num_sample_50/vina_output
        conda_env: benchmark_easydock
        docking_program: vina
        protonation: null
        config_fname: /mnt/sod/Veincent/manuscript/ScrambleBench/example/run_multiple_targets_multiple_parameters/config/easydock_config_5HT2C.yml
        protein_preparation: adfr
        protein_preparation_executable: /mnt/sod/Veincent/manuscript/ScrambleBench/src/scramblebench/script/utils/prepare_receptor
      glide:
        input: /mnt/sod/Veincent/manuscript/ScrambleBench/example/run_multiple_targets_multiple_parameters/output/input_generic_title2/num_sample_50/cheminformatics_input_prepared
        output: /mnt/sod/Veincent/manuscript/ScrambleBench/example/run_multiple_targets_multiple_parameters/output/input_generic_title2/num_sample_50/glide_output
        schrodinger_dir: /opt/schrodinger2025-4
        protonation: ligprep
        protein_preparation: protwizard
