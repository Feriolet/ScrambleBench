input:
  GPCR_5HT2C:
    complex_path: input/5ht2c/gpcr_5ht2c_6bqh_complex_autoprepared.pdb
    pdb_path: input/5ht2c/gpcr_5ht2c_6bqh_protein_autoprepared.pdb
    sdf_path: input/5ht2c/gpcr_5ht2c_6bqh_ligand.sdf
  generic_title2:
    complex_path: input/GPCR_DRD2/gpcr_drd2_6luq_complex_autoprepared.pdb
    pdb_path: input/GPCR_DRD2/gpcr_drd2_6luq_protein_autoprepared.pdb
    sdf_path: input/GPCR_DRD2/gpcr_drd2_6luq_ligand.sdf

# only test a few, you can add more if you like
model:
  diffsbdd:
    name: DiffSBDD
    dir: /opt/veincent/GenAI_manuscript/ScrambleBench/models/DiffSBDD
    conda_env: benchmark_diffsbdd
  pocket2mol:
    name: Pocket2Mol
    dir: /opt/veincent/GenAI_manuscript/ScrambleBench/models/Pocket2Mol
    conda_env: benchmark_pocket2mol

generation:
  input: output
  output: output
  parameter:
    box_size: 16
    num_sample: 50,100
    name: 5ht2c_prepared_0

post_generation:
  input: output
  output: cheminformatics_input_prepared
  pick_last: Pocket2Mol

analysis:
  genbench3d:
    input: cheminformatics_input_prepared
    output: cheminformatics_analysis
    genbench_dir: /opt/veincent/GenAI_manuscript/ScrambleBench/models/genbench3d
    conda_env: benchmark_genbench3d
    schrodinger_dir: /opt/schrodinger2025-4
    genbench_config: /opt/veincent/GenAI_manuscript/ScrambleBench/models/genbench3d/config/GenAI_evaluation.yaml
    do_complex_forcefield_minimisation: True
    do_docking_forcefield_minimisation: True
    do_cancel_protonation_by_obabel_or_adfr: True

  redocking:
    input: merged_generated_ligand
    output: Docking
    protonation: ligprep # ligprep, none, obabel
    easydock:
      input: Docking
      output: vina_output
      conda_env: benchmark_easydock
      protein_pdbqt_fname: GENBENCH3D # or insert fname
      config_fname:
      docking_program: vina
    
    glide:
      input: Docking
      output: glide_output
      grid_fname: GENBENCH3D 
      schrodinger_dir: /opt/schrodinger2025-4
      reward_intra_hbonds: True
      output_type: sdf
  
  diversity:
    metric: mces
    method: hamdiv








